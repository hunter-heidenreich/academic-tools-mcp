[project]
name = "academic-tools-mcp"
version = "2026.9.4"
description = "MCP server for academic research tools (OpenAlex, etc.)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7.1",
    "fastmcp>=3.2.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
# Bundled backend for convert_paper(mode="fast") when PDF_FAST_CONVERTER=pymupdf.
# The default fast backend ("pdftotext") needs the system poppler-utils instead.
fast = ["pymupdf>=1.24"]

[project.scripts]
academic-tools-mcp = "academic_tools_mcp.server:mcp.run"

[tool.uv]
package = true

[tool.uv.sources]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mcp[cli]>=1.27.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0",
    "hypothesis>=6.140",
    "ruff>=0.9.0",
    "mypy>=1.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/academic_tools_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
# The coverage floor lives in the CI step, not `addopts`: applied to every
# invocation it also fails `pytest tests/test_bibtex.py`, a workflow the README
# documents.

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Every selected rule already passes, so each is a ratchet, not a backlog.
# ANN/D/S hold for `src` only — see per-file-ignores; tests are ~2k bare asserts
# and undocumented fixtures by design. Left out on purpose: TID252 (intra-package
# relative imports are the house style), PLC0415 (lazy imports keep optional/slow
# deps off the import path), PLR2004 + PLR09xx, EM/TRY003, FBT (these bools are
# the MCP tool signatures agents call), COM812/Q (the formatter's job).
select = [
    "A", "ANN", "ASYNC", "B", "BLE", "C4", "D", "DTZ", "E", "EXE", "F", "FA",
    "FLY", "FURB", "G", "I", "ICN", "INT", "ISC", "LOG", "N", "PGH", "PIE", "PLE",
    "PLW", "PTH", "RET", "RSE", "RUF", "S", "SIM", "SLOT", "T10", "T20", "TC",
    "UP", "W", "YTT",
]
ignore = [
    "ANN401",   # **kwargs on the provider fetchers is genuinely dynamic
    "ASYNC240", # sync local-FS Path calls in async defs are deliberate; no trio/anyio here
    "D403",     # would "fix" arXiv/bioRxiv to ArXiv/BioRxiv
    "E501",     # the formatter wraps code; long docstrings/URLs are fine
    "ISC001",   # conflicts with the formatter
    "PTH105",   # os.replace is the named guarantee in README + .claude/rules, not a stylistic slip
    "RUF001",   # ambiguous unicode is the domain here: author diacritics
    "RUF002",
    "RUF003",
    "SIM108",   # long ternaries read worse than the explicit if/else
    "TC001",    # TC001-003 want imports deferred into TYPE_CHECKING blocks. httpx is
    "TC002",    # loaded at runtime by _clients regardless and the rest is stdlib, so
    "TC003",    # it buys no import time. The rest of TC guards the blocks themselves.
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "B011", "D", "S"]
# Both write to stderr on purpose: stdout is the JSON-RPC channel.
"src/academic_tools_mcp/_fast_extract.py" = ["T201"]
"src/academic_tools_mcp/_stats.py" = ["T201"]

[tool.mypy]
python_version = "3.11"
files = ["src/academic_tools_mcp"]
# Pragmatic, not strict: check what's annotated, ignore third-party stubs.
# Tighten incrementally.
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
